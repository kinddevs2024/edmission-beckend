<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Edmission · Admissions AI</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#17243d;background:#f4f7fb;font-size:15px}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dbe3ef;padding:20px 5%;display:flex;justify-content:space-between;align-items:center;gap:14px}h1{font-size:24px;margin:0}h2{font-size:19px}small,.muted{color:#60718b}main{max-width:1400px;margin:24px auto;padding:0 24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,.button{background:#173e78;color:#fff;border:0;border-radius:9px;padding:10px 14px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block}button.secondary{background:#e7edf7;color:#173e78}button.danger{background:#a83131}button:disabled{opacity:.5;cursor:wait}nav button{background:#e7edf7;color:#173e78}nav button.active{background:#173e78;color:white}.card{padding:22px;background:#fff;border:1px solid #dce4ef;border-radius:16px;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.split{display:grid;grid-template-columns:minmax(220px,1fr) minmax(330px,2fr);gap:18px}.stat{font-size:32px;font-weight:700}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{display:block;font-size:14px;margin:12px 0 6px}input,textarea,select{font:inherit;width:100%;border:1px solid #c9d5e5;border-radius:8px;background:#fff;color:#17243d;padding:10px}textarea{min-height:110px}input[type=checkbox]{width:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #e7edf7;vertical-align:top}th{font-size:13px;color:#60718b}.scroll{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;font-size:13px;line-height:1.5}.message{padding:12px;border-radius:12px;margin:10px 0;background:#eef2f8;white-space:pre-wrap;overflow-wrap:anywhere}.message.out{background:#e7f4ef}.message.staff{background:#fff2d8}.pill{display:inline-block;border-radius:20px;background:#e8eff9;padding:4px 9px;font-size:12px}dialog{border:0;border-radius:18px;width:min(720px,94vw);padding:24px;max-height:90vh;overflow:auto}dialog::backdrop{background:#14213b88}.error{background:#fff0ed;color:#962d20;padding:12px;border-radius:10px;margin-bottom:16px}.hidden{display:none!important}a{color:#173e78}.listitem{display:block;text-align:left;background:#f3f6fb;color:#17243d;width:100%;margin:8px 0}.badge{color:#996400}#login{max-width:430px;margin:60px auto}#toast{position:fixed;right:20px;bottom:20px;padding:14px;background:#173e78;color:white;border-radius:10px;z-index:100}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}fieldset{border:1px solid #dce4ef;border-radius:12px;margin:14px 0;padding:14px}@media(max-width:760px){.split{grid-template-columns:1fr}main{padding:0 12px}header{padding:18px}h1{font-size:20px}.card{padding:16px}th,td{padding:10px 5px}}
</style></head><body><header><div><small>EDMISSION · STAFF WORKSPACE</small><h1>Admissions AI Assistant</h1></div><div class="row"><a href="/admin/dashboard">Platform dashboard</a><button id="logout" class="secondary hidden">Sign out</button></div></header><main><section id="login" class="card"><h2>Staff sign in</h2><p class="muted">Use your existing Edmission administrator, manager or coordinator account.</p><form id="loginform"><label>Email</label><input name="email" type="email" autocomplete="username" required><label>Password</label><input name="password" type="password" autocomplete="current-password" required><div class="controls"><button>Sign in</button></div></form><div id="loginerror" role="alert"></div></section><section id="workspace" class="hidden"><nav id="nav"></nav><div id="error" role="alert"></div><section id="view" aria-live="polite"></section></section></main><dialog id="dialog"><div class="row" style="justify-content:space-between"><h2 id="dialogtitle"></h2><button id="closedialog" class="secondary" aria-label="Close dialog">×</button></div><div id="dialogbody"></div></dialog><div id="toast" class="hidden" role="status"></div><script src="/api/admissions/console.js" defer></script></body></html>
